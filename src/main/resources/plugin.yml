name: DeathMsg
version: '1.0.0'
main: pl.deathmsg.DeathMsgPlugin
api-version: '26.2'
description: Konfigurowalne komunikaty o smierci graczy na czacie.
authors: [DeathMsg]

commands:
  deathmsg:
    description: Zarzadzanie komunikatami smierci (reload, test)
    usage: /<command> <reload|test> [kategoria]
    aliases: [dmsg]
    permission: deathmsg.admin

permissions:
  deathmsg.admin:
    description: Przeladowanie configu i testowanie komunikatow
    default: op
